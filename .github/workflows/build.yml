name: Build ClawPal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    # Pinned by digest so a re-pushed tag cannot change the toolchain.
    container: espressif/idf:v5.5.2@sha256:05cbfc42ed2e987b8026722c15bf1d8523d3e4fd1b4ac04d2e4056f5e0918b99
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Audit source and build display
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          # The IDF container runs as a different user from the checkout owner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/check-publication.py
          python scripts/generate_languages.py --check
          python scripts/generate_timezones.py --check
          # Parser checks use ESP-IDF's own cJSON; zig supplies a compiler if the image has none.
          command -v gcc >/dev/null || command -v cc >/dev/null || python -m pip install --require-hashes -r tests/simulator/requirements.txt
          python tests/firmware_host/run.py
          export IDF_COMPONENT_MANAGER=0
          python scripts/build-firmware.py --all
          python scripts/collect-sdk-licenses.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ClawPal-firmware-payload
          path: payload/
  windows:
    needs: firmware
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ClawPal-firmware-payload
          path: payload
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test all three display layouts
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r tests/simulator/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Simulator compiler installation failed' }
          ./scripts/test-ui.ps1
      - name: Test and package
        shell: pwsh
        run: ./scripts/build.ps1
      # Records which commit and workflow produced these files; check with
      # `gh attestation verify <file> --repo Kaayoos/clawpal`. Pull requests get no OIDC token.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ClawPal-Setup.exe
            dist/clawpal-*.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ClawPal-release-files
          path: |
            dist/ClawPal-Setup.exe
            dist/ClawPal-Setup.exe.sha256
            dist/ClawPal-licenses.zip
            dist/clawpal-release.json
            dist/clawpal-*.bin
